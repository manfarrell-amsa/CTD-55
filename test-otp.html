<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>OTP Test</title></head>
<body style="font-family:sans-serif;padding:40px;max-width:500px">
<h2>OTP Test</h2>

<div id="log" style="background:#f0f0f0;padding:16px;border-radius:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;margin-bottom:20px;min-height:100px"></div>

<input id="email" value="mfarrell@automercado.biz" style="width:100%;padding:8px;margin-bottom:8px;font-size:14px">
<button onclick="testSave()" style="padding:10px 20px;margin-right:8px;cursor:pointer">1. Guardar OTP</button>

<br><br>
<input id="code" placeholder="Código recibido" style="width:100%;padding:8px;margin-bottom:8px;font-size:14px">
<button onclick="testLoad()" style="padding:10px 20px;cursor:pointer">2. Verificar OTP</button>

<script>
const WORKER = 'https://ctd-proxy.manuel-farrell.workers.dev';

function log(msg) {
  document.getElementById('log').textContent += new Date().toTimeString().slice(0,8) + ' ' + msg + '\n';
}

async function testSave() {
  const email = document.getElementById('email').value;
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  const key = 'otp_' + email;
  log('Saving key: respuestas_' + key);
  log('Code: ' + code);
  try {
    const res = await fetch(WORKER + '/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({userKey: key, data: {code: code, expires: Date.now() + 600000}})
    });
    const data = await res.json();
    log('Save response: ' + JSON.stringify(data));
    document.getElementById('code').value = code;
  } catch(e) {
    log('Save ERROR: ' + e.message);
  }
}

async function testLoad() {
  const email = document.getElementById('email').value;
  const input = document.getElementById('code').value;
  const key = 'otp_' + email;
  const loadUrl = WORKER + '/load?key=' + key;
  log('Loading URL: ' + loadUrl);
  try {
    const res = await fetch(loadUrl);
    log('HTTP status: ' + res.status);
    const data = await res.json();
    log('Load response: ' + JSON.stringify(data));
    if (!data.value) { log('FAIL: value is null'); return; }
    if (data.value.code !== input) { log('FAIL: code mismatch. Stored=' + data.value.code + ' Input=' + input); return; }
    if (Date.now() > data.value.expires) { log('FAIL: expired'); return; }
    log('SUCCESS: OTP válido ✓');
  } catch(e) {
    log('Load ERROR: ' + e.message);
  }
}
</script>
</body>
</html>
