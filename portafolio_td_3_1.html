<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portafolio TD 2025–2028 · Auto Mercado</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00A651;--green2:#00693A;--green3:#004C28;--greenl:#E8F7EF;
  --red:#ED1C24;--redl:#FEE8E9;
  --amber:#C8890A;--amberl:#FEF3DC;
  --blue:#1D4ED8;--bluel:#DBEAFE;
  --slate:#1C2826;--paper:#F8F7F4;--white:#FFF;
  --t1:#1A2E1F;--t2:#3D5242;--t3:#7A9080;--t4:#B0C4B8;
  --line:#DDE5DE;--line2:#EEF2EE;
  --ok:#065F46;--okl:#D1FAE5;
  --prog:#78350F;--progl:#FEF3C7;
  --eval:#1E3A8A;--evall:#DBEAFE;
  --cancel:#7F1D1D;--cancell:#FEE2E2;
  --new:#134E4A;--newl:#CCFBF1;
  --rep:#6B21A8;--repl:#F3E8FF;
  --fus:#92400E;--fusl:#FEF3C7;
  --highlight:#7C2D12;--highlightl:#FFF7ED;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--t1);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.65}

/* HEADER */
.header{background:var(--green3);padding:0 40px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--green)}
.h-brand{display:flex;align-items:center;gap:14px}
.h-logo{height:36px;width:auto}
.h-divider{width:1px;height:20px;background:rgba(255,255,255,.2)}
.h-title{font-size:11px;font-weight:500;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase}
.h-stats{display:flex;gap:20px;align-items:center}
.h-stat{text-align:center}
.h-stat-n{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:white;line-height:1}
.h-stat-l{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.35)}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:36px 40px 80px}

/* HERO */
.hero{margin-bottom:32px}
.hero-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,3.5vw,46px);font-weight:600;color:var(--t1);line-height:1.1;margin-bottom:8px}
.hero-sub{font-size:14px;color:var(--t3);max-width:600px;line-height:1.75;margin-bottom:20px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap}
.hpill{font-size:11px;font-weight:600;padding:4px 12px;border-radius:3px}
.hp-ok{background:var(--okl);color:var(--ok)}
.hp-prog{background:var(--progl);color:var(--prog)}
.hp-eval{background:var(--evall);color:var(--eval)}
.hp-new{background:var(--newl);color:var(--new)}
.hp-cancel{background:var(--cancell);color:var(--cancel)}
.hp-fus{background:var(--fusl);color:var(--fus)}

/* FILTERS */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.fb-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-right:4px}
.fb-btn{background:white;border:1px solid var(--line);padding:5px 14px;border-radius:20px;font-size:11px;color:var(--t2);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.fb-btn:hover,.fb-btn.active{background:var(--green3);color:white;border-color:var(--green3)}
.fb-search{border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--t1);outline:none;transition:border-color .15s;background:white;width:220px}
.fb-search:focus{border-color:var(--green)}

/* GRUPOS */
.group-header{display:flex;align-items:center;gap:12px;margin:28px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.gh-icon{font-size:18px}
.gh-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--t1)}
.gh-count{font-size:10px;background:var(--green3);color:white;padding:2px 9px;border-radius:10px;font-weight:500}
.gh-inv{font-family:'DM Mono',monospace;font-size:11px;color:var(--green2);font-weight:600;margin-left:auto}

/* PROYECTO CARD */
.proj-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.proj-card{background:white;border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:box-shadow .15s;cursor:pointer}
.proj-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
.proj-card.highlight-card{border-left:4px solid var(--highlight);background:#FFFBF8}
.proj-card.highlight-card:hover{box-shadow:0 3px 16px rgba(124,45,18,.12)}

.proj-row{display:flex;align-items:center;gap:12px;padding:13px 18px}
.pr-code{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);width:52px;flex-shrink:0}
.pr-highlight-badge{font-size:9px;font-weight:700;color:var(--highlight);background:var(--highlightl);padding:1px 7px;border-radius:2px;flex-shrink:0;letter-spacing:.04em}
.pr-name{font-size:14px;font-weight:500;color:var(--t1);flex:1;line-height:1.35}
.pr-ger{font-size:11px;color:var(--t3);width:160px;flex-shrink:0}
.pr-prog-wrap{width:80px;flex-shrink:0}
.pr-prog-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.pr-prog-fill{height:100%;border-radius:2px}
.pr-prog-val{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3)}
.pr-status{flex-shrink:0}
.pill{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:2px;letter-spacing:.03em}
.st-ok{background:var(--okl);color:var(--ok)}
.st-prog{background:var(--progl);color:var(--prog)}
.st-eval{background:var(--evall);color:var(--eval)}
.st-cancel{background:var(--cancell);color:var(--cancel)}
.st-new{background:var(--newl);color:var(--new)}
.st-rep{background:var(--repl);color:var(--rep)}
.st-fus{background:var(--fusl);color:var(--fus)}
.pr-toggle{color:var(--t4);font-size:16px;flex-shrink:0;transition:transform .2s}
.proj-card.open .pr-toggle{transform:rotate(180deg)}

/* FICHA */
.proj-detail{display:none;border-top:1px solid var(--line);background:#FAFBFD;padding:20px 22px}
.proj-card.open .proj-detail{display:block}
.pd-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.pd-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.pd-field{}
.pd-label{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.pd-value{font-size:13px;color:var(--t1);line-height:1.55}
.pd-value.mono{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--green2)}
.pd-desc{background:var(--line2);border-radius:4px;padding:11px 14px;font-size:13px;color:var(--t2);line-height:1.75;margin-bottom:14px}
.pd-section{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;margin-top:14px}
.pd-dims{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pd-dim{font-size:11px;padding:3px 10px;border-radius:3px;font-weight:500}
.pd-deps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pd-dep{font-size:11px;background:var(--amberl);color:var(--amber);padding:3px 9px;border-radius:3px;font-weight:500}
.pd-notas{background:white;border:1px solid var(--line);border-radius:4px;padding:11px 14px;font-size:12.5px;color:var(--t2);line-height:1.7}
.pd-pilares{display:flex;flex-direction:column;gap:4px}
.pd-pilar{font-size:12px;color:var(--t2);padding:4px 10px;background:var(--line2);border-radius:3px;display:flex;align-items:center;gap:6px}
.pd-pilar::before{content:'→';color:var(--green);font-size:11px}
.pd-highlight-note{background:var(--highlightl);border:1px solid #FED7AA;border-radius:4px;padding:10px 14px;font-size:12.5px;color:var(--highlight);line-height:1.65;margin-bottom:14px;font-weight:500}

/* NO RESULTS */
.no-results{text-align:center;padding:40px;color:var(--t3);font-size:14px}

/* MODAL OVERLAY disabled — use inline */
</style>
</head>

  const counts = {ok:0,prog:0,eval:0,new_:0,cancel:0};
  PROJECTS.forEach(p=>{
    if(p.status==='Completado') counts.ok++;

    else if(p.status==='En evaluación'||p.status==='Replanteado') counts.eval++;

function buildCard(p){
  const progColor = p.prog>=70?'#00A651':p.prog>=30?'#D97706':'#DC2626';
  const id = p.code.replace(/\./g,'_');
  const DC = {'Valor económico directo':'background:#D1FAE5;color:#065F46','Habilitación estratégica':'background:#DBEAFE;color:#1E3A8A','Reducción de riesgo':'background:#FEE2E2;color:#7F1D1D','Experiencia del cliente':'background:#FEF3C7;color:#78350F','Capacidad organizacional':'background:#F3E8FF;color:#6B21A8'};
  let det = '';
  if(p.highlight) det += '<div class="pd-highlight-note">★ Este proyecto se presentará en detalle en la Sesión #56 del Comité de Transformación Digital (26 mayo 2026).</div>';
  if(p.desc) det += '<div class="pd-desc">'+p.desc+'</div>';
  det += '<div class="pd-grid"><div class="pd-field"><div class="pd-label">Inversión</div><div class="pd-value mono">'+(p.inv||'—')+'</div></div><div class="pd-field"><div class="pd-label">Duración</div><div class="pd-value mono">'+(p.wk?p.wk+' semanas':'—')+'</div></div><div class="pd-field"><div class="pd-label">Complejidad</div><div class="pd-value">'+p.cplx+'</div></div></div>';
  det += '<div class="pd-grid-2"><div class="pd-field"><div class="pd-label">Inicio</div><div class="pd-value">'+(p.start||'—')+'</div></div><div class="pd-field"><div class="pd-label">Cierre estimado</div><div class="pd-value">'+(p.del||'—')+'</div></div></div>';
  det += '<div class="pd-field" style="margin-bottom:14px"><div class="pd-label">Área responsable</div><div class="pd-value">'+p.ger+'</div></div>';
  if(p.prio) det += '<div class="pd-field" style="margin-bottom:14px"><div class="pd-label">Prioridad en el programa</div><div class="pd-value"><span style="background:var(--greenl);color:var(--green2);font-size:12px;font-weight:700;padding:3px 10px;border-radius:3px">#'+p.prio+'</span></div></div>';
  if(p.beneficios&&p.beneficios.length) det += '<div class="pd-section">Tipos de valor</div><div class="pd-dims">'+p.beneficios.map(b=>'<span class="pd-dim" style="'+(DC[b]||'')+'">'+b+'</span>').join('')+'</div>';
  if(p.pilares&&p.pilares.length) det += '<div class="pd-section">Pilares estratégicos AM que impacta</div><div class="pd-pilares" style="margin-bottom:14px">'+p.pilares.map(pi=>'<div class="pd-pilar">'+pi+'</div>').join('')+'</div>';
  if(p.deps&&p.deps.length) det += '<div class="pd-section">Dependencias</div><div class="pd-deps">'+p.deps.map(d=>'<span class="pd-dep">⚡ '+d+'</span>').join('')+'</div>';
  if(p.notas) det += '<div class="pd-section">Notas relevantes</div><div class="pd-notas">'+p.notas+'</div>';

  let prog = '';
  if(p.status==='Completado') prog = '<div class="pr-prog-wrap"><div class="pr-prog-val" style="color:var(--ok)">✓ 100%</div><div class="pr-prog-bar"><div class="pr-prog-fill" style="width:100%;background:var(--green)"></div></div></div>';
  else if(p.prog>0) prog = '<div class="pr-prog-wrap"><div class="pr-prog-val">'+p.prog+'%</div><div class="pr-prog-bar"><div class="pr-prog-fill" style="width:'+p.prog+'%;background:'+progColor+'"></div></div></div>';
  else prog = '<div style="width:80px"></div>';

  return '<div class="proj-card '+(p.highlight?'highlight-card':'')+'" id="card-'+id+'" onclick="toggleCard(\''+id+'\')">'
    +'<div class="proj-row">'
    +'<div class="pr-code">'+p.code+'</div>'
    +(p.highlight?'<div class="pr-highlight-badge">★ Sesión #56</div>':'')
    +'<div class="pr-name">'+p.name+'</div>'
    +'<div class="pr-ger">'+p.ger+'</div>'
    +prog
    +'<div class="pr-status"><span class="pill '+p.sc+'">'+p.status+'</span></div>'
    +'<div class="pr-toggle">▾</div>'
    +'</div>'
    +'<div class="proj-detail" id="detail-'+id+'">'+det+'</div>'
    +'</div>';
}

function getFiltered(){
  if(currentSearch){const q=currentSearch.toLowerCase();return PROJECTS.filter(p=>p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)||p.ger.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q));}
  if(currentFilter==='sesion56') return PROJECTS.filter(p=>p.highlight);
  if(currentFilter==='Cancelado') return PROJECTS.filter(p=>p.status==='Cancelado'||p.status==='Fusionado');
  if(currentFilter==='En evaluación') return PROJECTS.filter(p=>p.status==='En evaluación'||p.status==='Replanteado');
  if(currentFilter!=='todos') return PROJECTS.filter(p=>p.status===currentFilter);
  return null;
}

function renderPortafolio(){
  const container = document.getElementById('portafolio-container');
  let html = '';
  const filtered = getFiltered();
  if(filtered !== null){
    if(!filtered.length){container.innerHTML='<div class="no-results">No se encontraron proyectos</div>';return;}
    html = '<div class="proj-list">'+filtered.map(buildCard).join('')+'</div>';
    container.innerHTML = html;
    return;
  }
  GRUPOS.forEach(g=>{
    const projects = PROJECTS.filter(p=>p.grupo===g.id);
    if(!projects.length) return;
    const totalInv = g.id==='completados' ? (()=>{let t=0;projects.forEach(p=>{if(p.inv&&p.inv.includes('K'))t+=parseFloat(p.inv.replace(/[^0-9.]/g,''))*1000;else if(p.inv&&p.inv.includes('M'))t+=parseFloat(p.inv.replace(/[^0-9.]/g,''))*1000000;});return t>0?'$'+(t/1000).toFixed(0)+'K':null;})() : null;
    html += '<div class="group-header"><span class="gh-icon">'+g.icon+'</span><span class="gh-title">'+g.label+'</span><span class="gh-count">'+projects.length+'</span>'+(totalInv?'<span class="gh-inv">'+totalInv+' inversión</span>':'')+'</div>';
    html += '<div class="proj-list">'+projects.map(buildCard).join('')+'</div>';
  });
  container.innerHTML = html || '<div class="no-results">Sin resultados</div>';
}

function toggleCard(id){
  const card = document.getElementById('card-'+id);
  if(card) card.classList.toggle('open');
}

function filterBy(filter, btn){
  currentFilter = filter;
  currentSearch = '';
  document.querySelector('.fb-search').value = '';
  document.querySelectorAll('.fb-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPortafolio();
}

function searchProjects(q){
  currentSearch = q;
  currentFilter = 'todos';
  document.querySelectorAll('.fb-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.fb-btn').classList.add('active');
  renderPortafolio();
}

// Init
renderStats();
renderPortafolio();
</script>
</body>
</html>
